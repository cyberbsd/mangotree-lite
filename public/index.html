<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芒果樹 · 工業東一區</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e6e4dc; --accent:#d9913c; --ok:#2e8b57; --warn:#c0392b; --chip:#f1efe8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141412; --fg:#ecebe6; --muted:#9a9890; --card:#1e1e1b; --line:#2e2d29; --chip:#2a2a26; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif; padding:0 16px 60px }
  header { position:sticky; top:0; background:var(--bg); padding:12px 0 8px; border-bottom:1px solid var(--line); z-index:2 }
  h1 { font-size:20px; margin:0 0 6px } .sub { color:var(--muted); font-size:13px }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding:8px 0 }
  .tab { white-space:nowrap; padding:6px 12px; border-radius:999px; background:var(--chip); border:1px solid var(--line); cursor:pointer; font-size:14px }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent) }
  .tab .st { font-size:11px; opacity:.8; margin-left:4px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:12px 0 }
  .vendor { font-weight:600; display:flex; justify-content:space-between; align-items:center; cursor:pointer }
  .vendor small { color:var(--muted); font-weight:400 }
  .items { display:none; margin-top:8px } .card.open .items { display:block }
  .item { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line) }
  .item .n { flex:1 } .item .p { color:var(--muted); font-size:14px; min-width:56px; text-align:right }
  .item .q { color:var(--muted); font-size:12px }
  button { font:inherit; border:1px solid var(--line); background:var(--chip); color:var(--fg); border-radius:8px; padding:6px 10px; cursor:pointer }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
  button.star { border:none; background:none; font-size:18px; padding:2px 6px }
  .banner { padding:10px 12px; border-radius:10px; margin:10px 0; font-size:14px }
  .banner.open { background:#e6f4ea; color:#1e6b3a } .banner.closed { background:#fdecea; color:#8a2b22 } .banner.upcoming { background:#fff4e0; color:#7a4b00 }
  @media (prefers-color-scheme: dark) { .banner.open{background:#193524;color:#9fd9b1} .banner.closed{background:#3a1f1c;color:#f0a79e} .banner.upcoming{background:#3a2d12;color:#f2cc7a} }
  .fav .item { border-top:none; border-bottom:1px solid var(--line) }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); max-width:480px; width:calc(100% - 32px) }
  dialog textarea { width:100%; height:120px; font:13px/1.4 ui-monospace,monospace; background:var(--chip); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px }
  .log { font:12px/1.4 ui-monospace,monospace; white-space:pre-wrap; color:var(--muted); max-height:160px; overflow:auto }
  .empty { color:var(--muted); padding:24px; text-align:center }
</style>
</head>
<body>
<header>
  <h1 id="title">芒果樹 · 工業東一區</h1>
  <div class="sub" id="meta">載入中…</div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><div class="empty">載入中…</div></main>

<dialog id="dlg">
  <h3 id="dlg-title" style="margin:0 0 8px"></h3>
  <div class="row" style="margin-bottom:8px">
    數量 <input id="dlg-qty" type="number" min="1" max="9" value="1" style="width:56px;font:inherit;padding:4px">
    <label><input id="dlg-auto" type="checkbox"> 自動送出訂單</label>
    <label><input id="dlg-rec" type="checkbox"> 記錄 API</label>
  </div>
  <div class="row">
    <button class="primary" id="dlg-go">用 Playwright 下單</button>
    <button id="dlg-open">開官網商品頁</button>
    <button id="dlg-copy">複製 Claude in Chrome 指令</button>
    <button id="dlg-done">我已手動訂好</button>
    <button id="dlg-close">關閉</button>
  </div>
  <p class="sub" style="margin:10px 0 4px">給 Claude in Chrome 的指令：</p>
  <textarea id="dlg-prompt" readonly></textarea>
  <div class="log" id="dlg-log"></div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
let DATA = null, current = null, sel = null;
const fmt = (iso) => iso ? new Date(iso).toLocaleString('zh-TW', { timeZone:'Asia/Taipei', month:'2-digit', day:'2-digit', weekday:'narrow', hour:'2-digit', minute:'2-digit', hour12:false }) : '?';
const fmtT = (iso) => iso ? new Date(iso).toLocaleTimeString('zh-TW', { timeZone:'Asia/Taipei', hour:'2-digit', minute:'2-digit', hour12:false }) : '?';
const STATUS = { open:'可訂', upcoming:'未開', closed:'已截止', unknown:'' };

async function load() {
  DATA = await (await fetch('/api/menu')).json();
  if (!DATA.ready) { $('#meta').textContent = '第一次抓菜單中（約 1–2 分鐘）…'; setTimeout(load, 15000); return; }
  $('#meta').textContent = `菜單更新 ${fmt(DATA.scrapedAt)} · 提醒：${DATA.config.meals.join(',')} 開放時 + 截止前 ${DATA.config.minutesBeforeClose} 分`;
  const want = location.hash.slice(1);
  const slots = DATA.slots;
  current = slots.find(s => s.key === want) || slots.find(s => s.status === 'open' && s.meal === 'lunch') || slots.find(s => s.status === 'open') || slots.find(s => s.status === 'upcoming') || slots[0];
  renderTabs(); render();
}
function renderTabs() {
  $('#tabs').innerHTML = DATA.slots.map(s => `<div class="tab ${s === current ? 'active' : ''}" data-k="${s.key}">${s.mealLabel} ${s.date ? s.date.slice(5).replace('-', '/') : ''}(${s.dayZh})<span class="st">${STATUS[s.status]}</span></div>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(t => t.onclick = () => { current = DATA.slots.find(s => s.key === t.dataset.k); location.hash = current.key; renderTabs(); render(); });
}
function isFav(v, it) { return DATA.favorites.some(f => f.vendorId === v.id && f.itemName === it.name); }
function render() {
  const s = current; if (!s) return;
  const w = s.window;
  let html = `<div class="banner ${s.status}">${s.mealLabel} ${s.date || ''}（${s.dayZh}）· ${STATUS[s.status]}　開放 ${fmt(w.from)} → 截止 ${fmt(w.until)}</div>`;
  const favs = DATA.favorites.map(f => { const v = s.vendors.find(v => v.id === f.vendorId || v.name === f.vendorName); const it = v && v.items.find(i => i.name === f.itemName); return it ? { v, it } : null; }).filter(Boolean);
  if (favs.length) html += `<div class="card fav"><div class="vendor">⭐ 常點（一鍵再來）</div><div class="items" style="display:block">${favs.map(({ v, it }) => itemRow(v, it, true)).join('')}</div></div>`;
  html += s.vendors.map(v => `<div class="card" data-v="${v.id}"><div class="vendor"><span>${v.name} <small>${v.priceRange || ''}${v.quantity != null ? ' · 剩 ' + v.quantity : ''}</small></span><span>${v.items.length} 項 ▾</span></div><div class="items">${v.items.map(it => itemRow(v, it)).join('') || '<div class="sub">（無法讀取品項）</div>'}</div></div>`).join('');
  if (DATA.orders.length) html += `<div class="card"><div class="vendor">最近訂單</div>${DATA.orders.slice(0, 8).map(o => `<div class="sub">${fmt(o.at)} · ${o.date || ''} ${o.itemName || ''} ×${o.qty || 1} ${o.submitted ? '✅' : '⏳未確認'}</div>`).join('')}</div>`;
  $('#main').innerHTML = html;
  $('#main').querySelectorAll('.card .vendor').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
  $('#main').querySelectorAll('[data-order]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openDialog(JSON.parse(b.dataset.order)); });
  $('#main').querySelectorAll('[data-fav]').forEach(b => b.onclick = async (e) => { e.stopPropagation(); DATA.favorites = await (await fetch('/api/favorites', { method:'POST', headers:{ 'content-type':'application/json' }, body: b.dataset.fav })).json(); render(); });
}
function itemRow(v, it, inFav = false) {
  const o = JSON.stringify({ vendorId: v.id, vendorName: v.name, vendorUrl: v.url, itemId: it.id, itemName: it.name, price: it.price });
  const soldOut = it.qty === 0 || v.soldOut;
  return `<div class="item"><span class="n">${inFav ? v.name + ' · ' : ''}${it.name}${soldOut ? ' <span class="q">售完</span>' : (it.qty != null ? ` <span class="q">剩${it.qty}</span>` : '')}</span><span class="p">${it.priceLabel || ''}</span><button class="star" data-fav='${o.replace(/'/g, '&#39;')}' title="常點">${isFav(v, it) ? '★' : '☆'}</button><button class="primary" ${soldOut || current.status !== 'open' ? 'disabled' : ''} data-order='${o.replace(/'/g, '&#39;')}'>訂</button></div>`;
}
function openDialog(o) {
  sel = o;
  $('#dlg-title').textContent = `${o.vendorName} · ${o.itemName}`;
  $('#dlg-log').textContent = '';
  $('#dlg-prompt').value = `到 ${o.vendorUrl} ，在「品項」選「${o.itemName}」，數量 ${$('#dlg-qty').value}，按「加入購物車」，然後到 https://www.mangotree.tw/checkout 完成結帳（配送區域 工業東一區，${current.mealLabel} ${current.date}）。送出前先把訂單內容唸給我確認。`;
  $('#dlg').showModal();
}
$('#dlg-qty').oninput = () => sel && openDialog(sel);
$('#dlg-close').onclick = () => $('#dlg').close();
$('#dlg-open').onclick = () => window.open(sel.vendorUrl, '_blank');
$('#dlg-copy').onclick = async () => { await navigator.clipboard.writeText($('#dlg-prompt').value); $('#dlg-log').textContent = '已複製，貼到 Chrome 的 Claude 側欄即可。'; };
$('#dlg-done').onclick = async () => { await fetch('/api/orders/manual', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ slotKey: current.key, date: current.date, vendorUrl: sel.vendorUrl, itemName: sel.itemName, qty: +$('#dlg-qty').value }) }); $('#dlg').close(); load(); };
$('#dlg-go').onclick = async () => {
  $('#dlg-log').textContent = '啟動瀏覽器、登入、加入購物車中…';
  const r = await (await fetch('/api/order', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ vendorUrl: sel.vendorUrl, itemName: sel.itemName, qty: +$('#dlg-qty').value, autoSubmit: $('#dlg-auto').checked, record: $('#dlg-rec').checked, slotKey: current.key, date: current.date }) })).json();
  $('#dlg-log').textContent = (r.steps || []).join('\n') + (r.error ? '\n錯誤：' + r.error : '') + (r.ok && !r.submitted ? '\n→ 結帳頁已開在瀏覽器視窗，請按最後的送出。' : '');
  if (r.ok) load();
};
load();
</script>
</body>
</html>
